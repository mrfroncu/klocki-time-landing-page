# Config CLI-owego BlueMapa uruchomionego w tym kontenerze — tylko webserver
# (-w), czyta gotowe kafelki z SQL. Nic tu nie renderuje ani nie wczytuje
# świata, więc większość opcji core.conf jest bez znaczenia.

# Wymagane przez BlueMapa (potwierdzenie EULA Mojanga) — samo w sobie nic
# tutaj nie pobiera, bo nie renderujemy, ale plugin i tak wymaga true.
accept-download: true

data: "data"
render-thread-count: 1
scan-for-mod-resources: false
metrics: false

log: {
  file: "logs/debug.log"
  append: false
}
