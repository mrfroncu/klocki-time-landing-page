server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # bezpieczne domyślne nagłówki
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # zahashowane assety + fonty — długi, niezmienny cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        types { font/woff2 woff2; }
    }

    # runtime-config i HTML — bez cache (żeby podmiana działała od razu)
    # config-json.conf generuje docker-entrypoint.sh z CONFIG_JSON_URL: gdy
    # ustawione — proxy_pass do configu edytowalnego przez panel; gdy puste —
    # zwykłe serwowanie public/config.json. NIE w conf.d/ (włączyłby się
    # drugi raz przez conf.d/*.conf z głównego nginx.conf obrazu, poza
    # blokiem server {} — błąd składni).
    include /etc/nginx/snippets/config-json.conf;
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ── Mapa (BlueMap CLI, ten sam kontener, port 8100) ─────────────────
    # Bez ukośnika na końcu -> przekieruj, żeby prefiksowy location niżej złapał żądanie.
    location = /map {
        # Nie $scheme: kontener nasłuchuje tylko na porcie 80 (TLS kończy się
        # na Cloudflare), więc $scheme byłby zawsze "http" -> przekierowanie
        # na zwykłe http:// jest blokowane w przeglądarce jako mixed content
        # przy osadzaniu w iframe na stronie https (np. panelu zarządzania).
        return 301 https://$host/map/;
    }
    location /map/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SSE (live tile/marker-updates) — bez buforowania, długi timeout.
        proxy_buffering off;
        proxy_read_timeout 1h;

        # Location z własnym add_header NIE dziedziczy nagłówków z bloku
        # server (nginx tak działa) — trzeba je tu powtórzyć, podmieniając
        # X-Frame-Options na CSP frame-ancestors, żeby panel zarządzania
        # mógł osadzić tę stronę w iframe (SAMEORIGIN by na to nie pozwolił).
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://alleria.pl https://*.alleria.pl" always;
    }
    # Webapp BlueMapa odpytuje te dwie ścieżki od ROOTA originu (nie relatywnie
    # do /map/), więc muszą być proxy'owane osobno.
    location = /settings.json {
        proxy_pass http://127.0.0.1:8100/settings.json;
    }
    # Waystones nadaje swoim markerom maxDistance=1000 (znikają przy oddaleniu),
    # a wartości nie da się zmienić w configu moda. Przepisujemy ją w locie na
    # praktycznie nieskończoną, żeby teleporty były widoczne przy pełnym oddaleniu.
    # Osobny location (regex ma pierwszeństwo nad prefiksowym /maps/) z
    # proxy_buffering on, bo sub_filter wymaga buforowania.
    location ~ ^/maps/.+/live/markers\.json$ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        # BlueMap ustawia max-age=86400 na markers.json (żywe dane!) - przez to
        # webapp trzyma starą kopię przez dobę. Wymuszamy świeże pobranie.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        sub_filter_types application/json;
        sub_filter '"maxDistance":1000.0' '"maxDistance":1.0E9';
        sub_filter_once off;
    }
    location /maps/ {
        proxy_pass http://127.0.0.1:8100/maps/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
