server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # bezpieczne domyślne nagłówki
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # zahashowane assety + fonty — długi, niezmienny cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        types { font/woff2 woff2; }
    }

    # runtime-config i HTML — bez cache (żeby podmiana działała od razu)
    location = /config.json {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
