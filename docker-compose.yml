services:
  klocki-landing:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SERVER_NAME: ${VITE_SERVER_NAME:-Klocki Time}
        VITE_SERVER_ADDRESS: ${VITE_SERVER_ADDRESS:-klocki-time.alleria.pl}
        VITE_SERVER_PORT: ${VITE_SERVER_PORT:-25565}
        VITE_SERVER_TAGLINE: ${VITE_SERVER_TAGLINE:-Prywatny serwer Minecraft dla znajomych.}
        VITE_MODPACK_NAME: ${VITE_MODPACK_NAME:-Klocki Time Pack}
        VITE_MODPACK_VERSION: ${VITE_MODPACK_VERSION:-}
        VITE_MC_VERSION_FALLBACK: ${VITE_MC_VERSION_FALLBACK:-1.20.1}
        VITE_DISCORD_URL: ${VITE_DISCORD_URL:-https://discord.gg/NyzNQWrBZW}
        VITE_MAP_URL: ${VITE_MAP_URL:-https://kt-mapa.alleria.pl/}
        VITE_STATUS_URL: ${VITE_STATUS_URL:-https://status.alleria.pl/}
        VITE_MANAGEMENT_URL: ${VITE_MANAGEMENT_URL:-https://kt-management.alleria.pl/}
        VITE_MCSTATUS_API_BASE: ${VITE_MCSTATUS_API_BASE:-https://api.mcstatus.io/v2/status/java}
        VITE_STATUS_POLL_SECONDS: ${VITE_STATUS_POLL_SECONDS:-60}
        VITE_MAP_EMBED: ${VITE_MAP_EMBED:-true}
    image: klocki-time-landing:latest
    container_name: klocki-time-landing
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-8970}:80'
