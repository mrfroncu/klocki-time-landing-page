<!doctype html>
<html lang="pl" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/sora-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <title>Klocki Time — serwer Minecraft</title>
    <meta
      name="description"
      content="Klocki Time — prywatny serwer Minecraft dla znajomych. Status na żywo, mapa świata, paczka modów i szybkie linki do Discorda oraz panelu."
    />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Klocki Time — serwer Minecraft" />
    <meta
      property="og:description"
      content="Status na żywo, mapa świata i paczka modów. Dołącz do serwera Klocki Time."
    />
    <meta property="og:image" content="/og.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pl_PL" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Wczesne ustawienie motywu, zanim React wystartuje (brak mignięcia). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kt-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'system';
          var root = document.documentElement;
          if (theme === 'system') {
            root.setAttribute('data-theme', 'system');
            root.style.colorScheme = 'light dark';
          } else {
            root.setAttribute('data-theme', theme);
            root.style.colorScheme = theme;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
        Ta strona wymaga JavaScriptu. Adres serwera: <strong>klocki-time.alleria.pl</strong>
      </div>
    </noscript>
  </body>
</html>
